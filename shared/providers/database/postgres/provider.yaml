schemaVersion: 1
kind: database
id: postgres
name: PostgreSQL 17
service: database
compose: compose.yaml
env:
  - name: DATABASE_URL
    summary: Postgres connection URL. Required in production; outside production it defaults to the local service.
    local: postgres://app:app@127.0.0.1:5432/app
    compose: postgres://app:app@database:5432/app
    test: postgres://app:app@127.0.0.1:5432/app_test
    testOverride: TEST_DATABASE_URL
    secret: true
files: [db/init.sql]
