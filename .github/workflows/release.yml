# Proves a tagged commit passes validate and every generated case before the release is published.
# The jobs are duplicated, not reused via workflow_call: a called workflow inherits the caller's
# github.workflow, so their concurrency groups would collide.
name: release

on:
  push:
    tags: ['v*']

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      # The version is exact because the lock in base/ must be checked by the uv that wrote it
      # (ADR 0002 M4-1). The action itself is pinned to a commit SHA: a tag can move, and
      # setup-uv publishes no moving major tag after v7.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Generator gates
        working-directory: tools
        run: bun install --frozen-lockfile && bun run check
      - name: Validate the catalog
        run: bun tools/validate.ts
      - name: Check lockfiles are in sync
        run: bun tools/validate.ts --lockfiles

  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - name: Install generator dependencies
        working-directory: tools
        run: bun install --frozen-lockfile
      - name: List cases
        id: cases
        run: |
          cases=$(bun tools/test-generated.ts --list)
          echo "cases=$cases" >> "$GITHUB_OUTPUT"

  case:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJson(needs.list.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      # The version is exact because the lock in base/ must be checked by the uv that wrote it
      # (ADR 0002 M4-1). The action itself is pinned to a commit SHA: a tag can move, and
      # setup-uv publishes no moving major tag after v7.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install generator dependencies
        working-directory: tools
        run: bun install --frozen-lockfile
      - name: Generate and test ${{ matrix.case }}
        run: bun tools/test-generated.ts --case ${{ matrix.case }} --e2e --install-browsers --with-services --with-app

  publish:
    needs: [validate, case]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # actions/checkout on a tag push fetches the commit, so the local tag may be lightweight
      # and --notes-from-tag would then take the commit message.
      - name: Fetch the annotated tag
        run: git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --verify-tag --notes-from-tag
