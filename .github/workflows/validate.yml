# Proves the catalog is consistent: the generator's own gates pass and every template validates.
name: validate

on:
  pull_request:
  push:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      # The version is exact because the lock in base/ must be checked by the uv that wrote it
      # (ADR 0002 M4-1). The action itself is pinned to a commit SHA: a tag can move, and
      # setup-uv publishes no moving major tag after v7.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          enable-cache: true
      - name: Generator gates
        working-directory: tools
        run: bun install --frozen-lockfile && bun run check
      - name: Validate the catalog
        run: bun tools/validate.ts
      - name: Check lockfiles are in sync
        run: bun tools/validate.ts --lockfiles
