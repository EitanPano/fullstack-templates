# Proves the catalog is consistent: the generator's own gates pass and every template validates.
name: validate

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      # The version is exact so CI is reproducible; the template supports uv 0.12.23 or later, below
      # 0.14 (ADR 0002 M4-1), and the lock was written by 0.12 and is checked here by 0.13.
      # The action itself is pinned to a commit SHA: a tag can move, and setup-uv publishes no
      # moving major tag after v7.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - name: Generator gates
        working-directory: tools
        run: bun install --frozen-lockfile && bun run check
      - name: Validate the catalog
        run: bun tools/validate.ts
      - name: Check lockfiles are in sync
        run: bun tools/validate.ts --lockfiles
