# Proves every listed template generates and passes its own gates (and e2e for frontends).
name: test-generated

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - name: Install generator dependencies
        working-directory: tools
        run: bun install --frozen-lockfile
      - name: List cases
        id: cases
        run: |
          cases=$(bun tools/test-generated.ts --list)
          echo "cases=$cases" >> "$GITHUB_OUTPUT"

  case:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJson(needs.list.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install generator dependencies
        working-directory: tools
        run: bun install --frozen-lockfile
      - name: Generate and test ${{ matrix.case }}
        run: bun tools/test-generated.ts --case ${{ matrix.case }} --e2e --install-browsers
