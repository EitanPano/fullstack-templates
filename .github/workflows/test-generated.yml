# Proves the listed templates generate and pass their own gates.
# - A pull request into `main` (a release), a manual run and a tag (release.yml) run every case
#   with e2e, the app smoke and services.
# - Any other pull request runs only the cases of the templates it touches, without e2e or
#   browsers; a change to the generator or shared files runs every case, still without e2e.
name: test-generated

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
      flags: ${{ steps.cases.outputs.flags }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - name: Install generator dependencies
        working-directory: tools
        run: bun install --frozen-lockfile
      - name: List cases
        id: cases
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          all=$(bun tools/test-generated.ts --list)
          if [ "$EVENT" = pull_request ] && [ "$BASE" != main ]; then
            flags="--with-services"
            export ALL="$all"
            export CHANGED=$(git diff --name-only "origin/$BASE...HEAD")
            cases=$(bun .github/select-cases.ts)
          else
            flags="--e2e --install-browsers --with-services --with-app"
            cases="$all"
          fi
          echo "cases=$cases" >> "$GITHUB_OUTPUT"
          echo "flags=$flags" >> "$GITHUB_OUTPUT"

  case:
    needs: list
    if: needs.list.outputs.cases != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJson(needs.list.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      # The version is exact so CI is reproducible; the template supports uv 0.12.23 or later, below
      # 0.14 (ADR 0002 M4-1), and the lock was written by 0.12 and is checked here by 0.13.
      # The action itself is pinned to a commit SHA: a tag can move, and setup-uv publishes no
      # moving major tag after v7.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install generator dependencies
        working-directory: tools
        run: bun install --frozen-lockfile
      # The single deploy mode needs Compose 2.35.0 or later (ADR 0003 M5-6); the log shows which
      # one the runner has when a case fails on it.
      - name: Log the Compose version
        run: docker compose version
      - name: Generate and test ${{ matrix.case }}
        run: bun tools/test-generated.ts --case ${{ matrix.case }} ${{ needs.list.outputs.flags }}
