# Proves every listed template generates and passes its own gates (and e2e for frontends).
name: test-generated

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      cases: ${{ steps.cases.outputs.cases }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      - name: Install generator dependencies
        working-directory: tools
        run: bun install --frozen-lockfile
      - name: List cases
        id: cases
        run: |
          cases=$(bun tools/test-generated.ts --list)
          echo "cases=$cases" >> "$GITHUB_OUTPUT"

  case:
    needs: list
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        case: ${{ fromJson(needs.list.outputs.cases) }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.x
      # The version is exact so CI is reproducible; the template supports uv 0.12.23 or later, below
      # 0.14 (ADR 0002 M4-1), and the lock was written by 0.12 and is checked here by 0.13.
      # The action itself is pinned to a commit SHA: a tag can move, and setup-uv publishes no
      # moving major tag after v7.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install generator dependencies
        working-directory: tools
        run: bun install --frozen-lockfile
      # The single deploy mode needs Compose 2.35.0 or later (ADR 0003 M5-6); the log shows which
      # one the runner has when a case fails on it.
      - name: Log the Compose version
        run: docker compose version
      - name: Generate and test ${{ matrix.case }}
        run: bun tools/test-generated.ts --case ${{ matrix.case }} --e2e --install-browsers --with-services --with-app
