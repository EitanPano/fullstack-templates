schemaVersion: 1
templates:
  - id: bun-express
    kind: server
    path: server/bun-express
    version: 3.1.0
    summary: "Layered Express 5 API on Bun: zod schemas, OpenAPI from them, auth, jobs and a bus"
  - id: python-fastapi
    kind: server
    path: server/python-fastapi
    version: 2.1.0
    summary: "Layered FastAPI API on Python 3.14 and uv: pydantic models, OpenAPI from them, one error envelope"
  - id: angular
    kind: frontend
    path: frontend/angular
    version: 4.1.0
    summary: "Angular 22 single-page app on standalone components and signals, @ngrx/signals stores, co-located SCSS on a global token tree and Hey API's Angular client, with Transloco and the service worker behind flags"
  - id: next
    kind: frontend
    path: frontend/next
    version: 4.0.0
    summary: "Next.js 16 App Router with a typed client generated from the server's contract"
  - id: react
    kind: frontend
    path: frontend/react
    version: 6.0.0
    summary: "Vite and React 19 single-page app: React Router data mode, Redux Toolkit with RTK Query over a client generated from the server's contract, Radix primitives styled by co-located SCSS on a global token tree"
  - id: vue
    kind: frontend
    path: frontend/vue
    version: 4.0.0
    summary: "Vite and Vue 3 single-page app: Vue Router 5, Pinia 4 setup stores over a client generated from the server's contract, Reka UI primitives styled by co-located SCSS on a global token tree, vue-i18n and the service worker behind flags"
stacks:
  - id: angular-bun-express
    path: stacks/angular-bun-express
    summary: Angular 22 in front of Express 5 on Bun
  - id: angular-python-fastapi
    path: stacks/angular-python-fastapi
    summary: Angular 22 in front of FastAPI on Python 3.14
  - id: next-bun-express
    path: stacks/next-bun-express
    summary: Next.js 16 in front of Express 5 on Bun
  - id: next-python-fastapi
    path: stacks/next-python-fastapi
    summary: Next.js 16 in front of FastAPI on Python 3.14
  - id: react-python-fastapi
    path: stacks/react-python-fastapi
    summary: React 19 (Vite) in front of FastAPI on Python 3.14
  - id: react-bun-express
    path: stacks/react-bun-express
    summary: React 19 (Vite) in front of Express 5 on Bun
  - id: vue-bun-express
    path: stacks/vue-bun-express
    summary: Vue 3 (Vite) in front of Express 5 on Bun
  - id: vue-python-fastapi
    path: stacks/vue-python-fastapi
    summary: Vue 3 (Vite) in front of FastAPI on Python 3.14
