  test:db: bun test --preload ./tests/db/setup.ts
  db:e2e: bun run src/infra/scripts/e2e-db.ts
container:
  migrate: bun run src/infra/scripts/migrate.ts
commands:
  testDb: bun run test:db
  e2eDb: bun run db:e2e
  migrate: bun run db:migrate
