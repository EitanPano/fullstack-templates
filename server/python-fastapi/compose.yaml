build: ./__PACKAGE_DIR__
environment:
  APP_ENV: production
  PORT: "__PORT__"
  # Required in production; the backend fails fast at boot when one is missing. Plain
  # ${VAR} (not ${VAR:?}) so `docker compose up -d <service>` for local infrastructure
  # needs no secrets in the shell.
  # @auth-start
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
  OTP_SECRET: ${OTP_SECRET}
  # @auth-end
  ENCRYPTION_KEY: ${ENCRYPTION_KEY}
  # One reverse proxy in front (the Next.js server counts); IP-keyed rate limits depend on it.
  TRUST_PROXY: ${TRUST_PROXY:-1}
  # Comma-separated browser origins; empty keeps CORS off (the Next.js server is the client).
  CORS_ORIGINS: ${CORS_ORIGINS:-}
  # Scheduled jobs run on exactly one replica. The template itself runs as one instance
  # @nodatabase-start
  # until the data-layer and cache tasks (the stores, rate limits and the bus live in one
  # process).
  # @nodatabase-end
  # @database:postgres-start
  # until the cache task (the cache, rate limits and the bus live in one process).
  # @database:postgres-end
  JOBS_ENABLED: ${JOBS_ENABLED:-true}
# Loopback only: the frontend container reaches the backend on the compose network.
# Publishing the port on every interface with TRUST_PROXY=1 would let any direct caller
# choose its own client IP through X-Forwarded-For.
ports: ["127.0.0.1:__PORT__:__PORT__"]
profiles: ["app"]
