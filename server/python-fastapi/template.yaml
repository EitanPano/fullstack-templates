schemaVersion: 1
id: python-fastapi
kind: server
name: FastAPI on Python 3.14
version: 1.0.0
summary: "Layered FastAPI API on Python 3.14 and uv: pydantic models, OpenAPI from them, one error envelope"
runtime: { language: python, platform: cpython, minVersion: '3.14' }
tools:
  - { name: uv, min: '0.12.23' }
placeholders: [PROJECT_NAME]
flags:
  auth:
    summary: Accounts, sessions, JWT, OTP; off means every endpoint is public
    default: true
    onlyPaths:
      - src/app/middleware/auth.py
      - src/app/middleware/role.py
      - src/app/models/auth
      - src/app/models/session
      - src/app/models/user
      - src/app/services/communicate/templates
      - src/app/services/security/cookies.py
      - src/app/services/security/jwt.py
      - src/app/services/security/otp.py
      - src/app/services/session.py
      - tests/middleware/test_auth.py
      - tests/middleware/test_role.py
      - tests/services/test_cookies.py
      - tests/services/test_jwt.py
      - tests/services/test_otp.py
      - tests/services/test_session.py
capabilities:
  database: { providers: [] }
  cache: { providers: [] }
  messaging: { providers: [], mode: push }
dependencies: { manifest: pyproject.toml, adapter: pyproject }
commands:
  install: uv sync
  dev: uv run poe dev
  check: uv run poe check
  typecheck: uv run poe typecheck
  lint: uv run poe lint
  format: uv run poe format
  test: uv run poe test
  contract: uv run poe contract
contract: { produces: openapi.json }
http: { port: 8000, health: /api/health, ready: /api/health/ready }
gitignore: [python]
agents: AGENTS.md
defaultStack: next-python-fastapi
postGenerate:
  - install
  - contract
  - format
dropAfterPostGenerate:
  - .venv
  - .mypy_cache
  - .ruff_cache
  - .pytest_cache
  - .import_linter_cache
