schemaVersion: 1
id: astro-cloudflare
summary: Astro 7 in front of one Cloudflare Worker with static assets on D1
packages:
  - template: serverless/cloudflare
    dir: serverless/cloudflare
  - template: frontend/astro
    dir: frontend
# Run beside the Worker as one of several frontends, never alone (ADR 0017).
frontends:
  - frontend/angular
