schemaVersion: 1
id: cloudflare
kind: serverless
name: Cloudflare Workers
version: 3.1.0
summary: "One Cloudflare Worker with static assets, routed by Hono: D1 through Drizzle, zod schemas and the OpenAPI contract from them, one error envelope, tests in workerd; serves a frontend's build on one origin"
runtime: { language: typescript, platform: cloudflare-workers, minVersion: '24' }
tools:
  - { name: bun, min: '1.4' }
  - { name: node, min: '24' }
placeholders: [PROJECT_NAME]
flags:
  jobs:
    summary: A cron trigger and a scheduled handler in the same Worker, the cleanup of expired rate-limit rows
    default: false
    onlyPaths:
      - tests/api/jobs.test.ts
      - tests/unit/jobs-config.test.ts
dependencies: { manifest: package.json, adapter: npm }
commands:
  install: bun install
  dev: bun run dev
  start: bun run start
  check: bun run check
  typecheck: bun run typecheck
  lint: bun run lint
  format: bun run format
  test: bun run test
  testDb: bun run test:db
  migrate: bun run migrate
  e2eDb: bun run e2e:db
  contract: bun run openapi
contract: { produces: openapi.json }
http: { port: 8788, health: /api/health, ready: /api/health/ready }
onlyWhen:
  sdk:
    - server/api/sdk
    - server/middleware/sdk-files.ts
    - server/middleware/sdk-gate.ts
    - server/services/security/sdk-keys.ts
    - server/services/telemetry.ts
    - scripts/lib/sdk-build.mjs
    - tests/api/sdk-assets.ts
    - tests/api/sdk-config.test.ts
    - tests/api/sdk-files.test.ts
    - tests/api/sdk-frame-only.test.ts
    - tests/api/sdk-frame.test.ts
    - tests/api/sdk-keys.test.ts
    - tests/api/sdk-lookup.test.ts
    - tests/api/sdk-telemetry.test.ts
    - tests/unit/sdk-build.test.ts
    - tests/unit/sdk-start.test.ts
gitignore: [node, cloudflare]
agents: AGENTS.md
postGenerate:
  - install
  - contract
  - format
