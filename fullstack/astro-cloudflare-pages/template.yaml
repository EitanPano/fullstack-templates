schemaVersion: 1
id: astro-cloudflare-pages
kind: fullstack
name: Astro on Cloudflare Pages
version: 1.0.0
summary: "One package on Cloudflare Pages: static Astro pages and Pages Functions on one origin, D1 through Drizzle, one error envelope, zod schemas shared by the pages and the functions"
runtime: { language: typescript, platform: cloudflare-pages, minVersion: "24" }
tools:
  - { name: bun, min: "1.4" }
  - { name: node, min: "24" }
placeholders: [PROJECT_NAME]
dependencies: { manifest: package.json, adapter: npm }
commands:
  install: bun install
  dev: bun run dev
  start: bun run start
  check: bun run check
  typecheck: bun run typecheck
  lint: bun run lint
  format: bun run format
  test: bun run test
  testDb: bun run test:db
  migrate: bun run migrate
  e2eDb: bun run e2e:db
http: { port: 4321, health: /api/health }
gitignore: [node, cloudflare]
agents: AGENTS.md
defaultStack: astro-cloudflare-pages
postGenerate:
  - install
  - format
# Which role writes which path (ADR 0014, K3). A path may sit in both implementer lanes. Later
# tasks add the paths they create (tests/e2e, workers).
lanes:
  backend:
    - functions
    - server
    - shared
    - migrations
    - tests/api
    - scripts
    - wrangler.jsonc
    - worker-configuration.d.ts
    - drizzle.config.ts
    - tsconfig.server.json
    - .env.example
    - package.json
    - bun.lock
    - tsconfig.json
    - eslint.config.mjs
    - vitest.config.ts
    - .prettierrc
    - .prettierignore
    - tests/unit
    - AGENTS.md
  frontend:
    - src
    - public
    - astro.config.mjs
    - scripts
    - package.json
    - bun.lock
    - tsconfig.json
    - eslint.config.mjs
    - vitest.config.ts
    - .prettierrc
    - .prettierignore
    - tests/unit
    - AGENTS.md
  qa:
    - tests
