schemaVersion: 1
cases:
  # The stack: the Astro site beside the Cloudflare functions on one origin, with the e2e suite.
  - name: default
    stack: astro-cloudflare
  # The frontend generated by itself: no server, no generated client, no proxy; its e2e serves the
  # built site with astro preview.
  - name: alone
  # The islands flag on, beside the Worker: the React integration, its dependencies and the rules
  # for .tsx under src/components/islands.
  - name: islands
    stack: astro-cloudflare
    flags: { islands: true }
  # The Worker's jobs flag on: the frontend must hold with it.
  - name: jobs
    stack: astro-cloudflare
    server: { flags: { jobs: true } }
  # Two frontends, `site` and `admin`, beside the one Worker (ADR 0015, 0016): each on its own host,
  # each with its own e2e run, the React islands on `admin` only.
  - name: two
    stack: astro-cloudflare
    frontends: ["site=frontend/astro", "admin=frontend/astro"]
    packages:
      admin: { flags: { islands: true } }
  # Two frontends of two templates beside the one Worker (ADR 0017): the Astro `site` and an
  # Angular `admin`, a single-page app the Worker serves from its own folder of dist/.
  - name: two-templates
    stack: astro-cloudflare
    frontends: ["site=frontend/astro", "admin=frontend/angular"]
    packages:
      admin: { flags: { i18n: false, pwa: false } }
  # The same with the Angular defaults: Transloco (English and Hebrew) and the service worker on.
  - name: two-templates-default
    stack: astro-cloudflare
    frontends: ["site=frontend/astro", "admin=frontend/angular"]
  # The one frontend at a directory that is not `frontend`: it must hold with one build at the root
  # of dist/, no host map and the Worker not run for a page.
  - name: one-at-site
    stack: astro-cloudflare
    frontends: ["site=frontend/astro"]
  # Non-default brand values through every gate: the cases above all generate the default brand.
  - name: brand
    stack: astro-cloudflare
    brand:
      primary: "#ea580c"
      neutral: "#64748b"
      radius: sm
      font: inter
      theme: dark
      density: compact
