# Rendered by the image's entrypoint (envsubst) to /etc/nginx/conf.d/default.conf. Only the
# @server-start
# PORT and API_URL variables are ours; nginx's own variables are left alone. envsubst also
# @server-end
# @noserver-start
# PORT variable is ours; nginx's own variables are left alone. envsubst also
# @noserver-end
# rewrites a dollar-name inside a comment, so no dollar sign in comments.
#
# A location with an add_header of its own drops every add_header of the level above. So no
# add_header at server level: each static location includes the headers snippet itself, and the
# proxied location has none, which leaves the server's own headers untouched.

resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off; # @server

# @server-start
# Only the path part is checked (a query may hold two dots), and /api/ requests are left to the
# server's own guards.
# @server-end
# @noserver-start
# Only the path part is checked (a query may hold two dots).
# @noserver-end
map $request_uri $refused_path {
  default 0;
  ~^/api/ 0; # @server
  ~*^[^?]*(\.\.|%2e%2e|%2e\.|\.%2e|%5c) 1;
}

server {
  listen ${PORT};
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  autoindex off;

  # Encoded or backslash traversal that nginx's parser lets through would be normalised into a
  # path that falls to the SPA fallback; refuse it. A raw path above the root gets nginx's 400.
  if ($refused_path) { return 404; }

  # Dotfiles anywhere.
  location ~ /\. { return 404; }

  # @server-start
  # Proxied API: ^~ beats the regex locations below. The variable defers DNS to request time, so
  # nginx starts while the server is down; with no URI part the request path passes unchanged.
  location ^~ /api/ {
    set $api_upstream ${API_URL};
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }
  # @server-end

  # Hashed build output at the root (Angular 22 names them main, polyfills, chunk and styles, a
  # dash and an eight-character hash): immutable. The quotes are required around the braces.
  location ~ "^/(main|polyfills|chunk|styles)-[A-Za-z0-9_-]{8}\.(js|css)$" {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Hashed files the build copies out of the stylesheets (fonts, images). A missing file or a
  # directory is a 404, never the SPA.
  location ~ ^/media/.+[^/]$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # The icons are not hashed: a day, then revalidated.
  location ~ ^/icons/.+[^/]$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=86400";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # The copy tables are loaded at run time and change with a release: always revalidated.
  location ~ ^/i18n/.+[^/]$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # A directory of the static folders is a 404, never a listing or the SPA.
  location ~ ^/(media|icons|i18n)/$ { return 404; }

  # The shell and the service worker's files must always be revalidated, or an update never
  # reaches a browser that cached them.
  location ~ ^/(index\.html|ngsw\.json|ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|manifest\.webmanifest)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Any other path with an extension is a file or a 404 (a mistyped asset is not an HTML page).
  location ~ \.[^/]+$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Extension-less paths are client routes.
  location / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
}
