@if (install.showIosHint()) {
  <div class="install-hint container">
    <p>{{ 'pwa.iosHint' | t }}</p>
    <app-button
      variant="ghost"
      size="icon"
      [ariaLabel]="'actions.dismiss' | t"
      (click)="install.dismissIosHint()"
    >
      <app-icon name="close" />
    </app-button>
  </div>
}
