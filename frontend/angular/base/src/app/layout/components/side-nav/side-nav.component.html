@if (open()) {
  <div class="side-nav-backdrop" aria-hidden="true" (click)="close()"></div>
}
<nav
  id="side-nav"
  class="side-nav"
  [class.is-open]="open()"
  [attr.aria-label]="'nav.primary' | t"
  [cdkTrapFocus]="modal()"
>
  <app-button
    class="side-nav__close"
    variant="ghost"
    size="icon"
    [ariaLabel]="'nav.close' | t"
    (click)="close()"
  >
    <app-icon name="close" />
  </app-button>
  <ul class="side-nav__list">
    @for (entry of entries(); track entry.path) {
      <li>
        <a
          class="side-nav__link"
          [routerLink]="entry.path"
          routerLinkActive="is-active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: entry.path === '/' }"
          >{{ entry.labelKey | t }}</a
        >
      </li>
    }
  </ul>
</nav>
