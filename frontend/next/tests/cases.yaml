schemaVersion: 1
cases:
  - name: default
    stack: next-bun-express
  - name: auth-off
    stack: next-bun-express
    server: { flags: { auth: false } }
  # The production e2e against a real database (app_e2e) and, with --with-app, against the image.
  - name: stack-postgres
    stack: next-bun-express
    withApp: true
    server: { capabilities: { database: postgres } }
  - name: python
    stack: next-python-fastapi
  - name: alone
  # Non-default brand values through every gate: the cases above all generate the default brand.
  - name: brand
    stack: next-bun-express
    brand:
      displayName: Brand Case
      primary: '#facc15'
      neutral: '#78716c'
      radius: lg
      font: inter
      theme: dark
      density: compact
