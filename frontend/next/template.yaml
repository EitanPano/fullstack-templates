schemaVersion: 1
id: next
kind: frontend
name: Next.js 16 App Router
version: 4.0.0
summary: "Next.js 16 App Router with a typed client generated from the server's contract"
runtime: { language: typescript, platform: node, minVersion: '24' }
tools:
  - { name: bun, min: '1.4' }
  - { name: node, min: '24' }
placeholders: [PROJECT_NAME]
dependencies: { manifest: package.json, adapter: npm }
commands:
  install: bun install
  dev: bun run dev
  check: bun run check
  typecheck: bun run typecheck
  lint: bun run lint
  format: bun run format
  test: bun run test
  testE2e: bun run test:e2e
  contract: bun run api:types
contract: { consumes: '<server>/openapi.json' }
http: { port: 3000, health: / }
gitignore: [node, next]
# The server-coupled parts (the generated client and its wrapper, the API address, the contract
# script and its package) exist only when the plan has a server (ADR 0011); lines inside shared
# files carry // @server markers.
# The auth glue exists only while the stack's server has its auth flag on (the contract then has
# /api/auth and /api/user). Lines inside shared files carry // @server:auth markers.
onlyWhen:
  server:
    onlyPaths:
      - openapi-ts.config.ts
      - src/services/generated
      - src/services/client.ts
      - src/services/client.test.ts
      - src/services/call.ts
      - src/services/call.test.ts
      - src/core/config/env.test.ts
    dependencies:
      remove:
        - '@hey-api/openapi-ts'
    scripts:
      remove:
        - 'api:types'
  server:auth:
    - src/proxy.ts
    - src/app/(auth)
    - src/app/(site)/forbidden
    - src/app/(site)/profile
    - src/core/auth
    - src/core/actions/account-action.test.ts
    - src/shared/components/auth-card
    - src/models/user
    - src/models/auth
    - src/actions/auth
    - src/services/auth.ts
    - src/services/auth.test.ts
    - src/services/user.ts
    - src/services/user.test.ts
    - src/shared/utils/initials.ts
    - src/shared/utils/initials.test.ts
    - src/layout/app-account-menu
    - src/layout/app-account-menu-skeleton
    - src/layout/app-auth-loading
    - src/layout/app-sign-out-item.tsx
    - tests/e2e/auth-support.ts
    - tests/e2e/auth.spec.ts
    - tests/unit/proxy-config.test.ts
  server:database:
    - scripts/e2e-database-url.ts
    - tests/unit/e2e-database-url.test.ts
agents: AGENTS.md
defaultStack: next-bun-express
postGenerate:
  - install
  - contract
  - format
