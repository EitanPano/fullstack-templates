schemaVersion: 1
id: next
kind: frontend
name: Next.js 16 App Router
version: 2.0.0
summary: "Next.js 16 App Router with a typed client generated from the server's contract"
runtime: { language: typescript, platform: node, minVersion: '24' }
tools:
  - { name: bun, min: '1.4' }
  - { name: node, min: '24' }
placeholders: [PROJECT_NAME]
dependencies: { manifest: package.json, adapter: npm }
commands:
  install: bun install
  dev: bun run dev
  check: bun run check
  typecheck: bun run typecheck
  lint: bun run lint
  format: bun run format
  test: bun run test
  testE2e: bun run test:e2e
  contract: bun run api:types
contract: { consumes: '<server>/openapi.json' }
http: { port: 3000, health: / }
gitignore: [node]
# The auth glue exists only while the stack's server has its auth flag on (the contract then has
# /api/auth and /api/user). Lines inside shared files carry // @server:auth markers.
onlyWhen:
  server:auth:
    - src/proxy.ts
    - src/app/(auth)
    - src/app/(site)/forbidden
    - src/app/(site)/profile
    - src/shared/auth
    - src/shared/ui/pattern/auth-card.tsx
    - src/entity/user
    - src/feature/auth
    - src/widget/account-menu
    - src/widget/guest-only
    - src/widget/profile
    - src/widget/sign-in
    - src/widget/sign-up
    - tests/unit/account-action.test.ts
    - tests/unit/account-menu.test.tsx
    - tests/unit/profile.test.tsx
    - tests/unit/profile-page.test.tsx
    - tests/unit/auth-actions.test.ts
    - tests/unit/auth-model.test.ts
    - tests/unit/auth-pages.test.tsx
    - tests/e2e/auth-support.ts
    - tests/e2e/auth.spec.ts
    - tests/unit/session-cookies.test.ts
    - tests/unit/session-proxy.test.ts
    - tests/unit/session.test.ts
    - tests/unit/sign-in-form.test.tsx
    - tests/unit/sign-up-form.test.tsx
    - tests/unit/proxy-config.test.ts
  server:database:
    - scripts/e2e-database-url.ts
    - tests/unit/e2e-database-url.test.ts
agents: AGENTS.md
defaultStack: next-bun-express
postGenerate:
  - install
  - contract
  - format
