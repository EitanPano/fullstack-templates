build: ./__PACKAGE_DIR__
environment:
  NODE_ENV: production
  API_URL: http://__SERVER_DIR__:__SERVER_PORT__ # @server
  # Unset by default; see AGENTS.md > Deployment before a production run. A blank value is unset.
  CLIENT_IP_HEADER: ${CLIENT_IP_HEADER:-} # @server
ports: ["__PORT__:__PORT__"]
depends_on: [__SERVER_DIR__] # @server
profiles: ["app"]
