schemaVersion: 1
id: vue
kind: frontend
name: Vue 3 SPA (Vite)
version: 4.0.0
summary: "Vite and Vue 3 single-page app: Vue Router 5, Pinia 4 setup stores over a client generated from the server's contract, Reka UI primitives styled by co-located SCSS on a global token tree, vue-i18n and the service worker behind flags"
runtime: { language: typescript, platform: node, minVersion: "24" }
tools:
  - { name: bun, min: "1.4" }
  - { name: node, min: "24" }
placeholders: [PROJECT_NAME]
dependencies: { manifest: package.json, adapter: npm }
commands:
  install: bun install
  dev: bun run dev
  check: bun run check
  typecheck: bun run typecheck
  lint: bun run lint
  format: bun run format
  test: bun run test
  testE2e: bun run test:e2e
  contract: bun run api:types
contract: { consumes: "<server>/openapi.json" }
http: { port: 5173, health: / }
static: { out: dist }
gitignore: [node]
agents: AGENTS.md
defaultStack: vue-bun-express
flags:
  i18n:
    summary: "vue-i18n with English and Hebrew (RTL), a language toggle and a lazily loaded Hebrew copy table"
    default: true
    onlyPaths:
      - src/layout/app-language-toggle/app-language-toggle.spec.ts
      - src/layout/app-language-toggle/app-language-toggle.vue
      - src/layout/rtl.spec.ts
      - src/core/i18n/languages.ts
      - src/core/i18n/translations/he.json
      - src/core/initializers/i18n.initializer.spec.ts
      - src/core/initializers/i18n.initializer.ts
      - src/store/language.store.spec.ts
      - src/store/language.store.ts
      - tests/unit/rtl-styles.spec.ts
      - tests/unit/translation-parity.spec.ts
  pwa:
    summary: "Installable app: web manifest and the Workbox service worker (vite-plugin-pwa), with update and install prompts"
    default: true
    onlyPaths:
      - public/icons/apple-touch-icon.png
      - public/icons/icon-192.png
      - public/icons/icon-512.png
      - public/icons/icon.svg
      - public/icons/maskable-512.png
      - src/layout/app-install-button/app-install-button.spec.ts
      - src/layout/app-install-button/app-install-button.vue
      - src/core/initializers/pwa.initializer.spec.ts
      - src/core/initializers/pwa.initializer.ts
      - src/store/app-update.store.spec.ts
      - src/store/app-update.store.ts
      - src/store/install-prompt.store.spec.ts
      - src/store/install-prompt.store.ts
      - src/testing/pwa-register.stub.ts
    dependencies:
      remove: ["vite-plugin-pwa", "workbox-window"]
# Everything that reaches the server exists while the plan has one (ADR 0011): the generated
# client, its wrapper and interceptors, the error envelope's models, helpers and copy table, the form
# helper that reads a server field error, the request stores and the fetch stub of the specs.
# Lines inside shared files carry // @server markers (a .vue file takes template block markers
# only). The auth glue (server:auth) and the database-only files exist while the stack's server has the
# flag or capability. Lines inside shared files carry // @server:auth and // @server:database
# markers; a .vue file takes template block markers only.
onlyWhen:
  server:
    onlyPaths:
      - openapi-ts.config.ts
      - src/core/config/api-client.spec.ts
      - src/core/config/api-client.ts
      - src/core/config/error-copy.spec.ts
      - src/core/config/error-copy.ts
      - src/core/interceptors/error.interceptor.spec.ts
      - src/core/interceptors/error.interceptor.ts
      - src/core/interceptors/http.provider.spec.ts
      - src/core/interceptors/http.provider.ts
      - src/core/interceptors/loading.interceptor.spec.ts
      - src/core/interceptors/loading.interceptor.ts
      - src/models/api
      - src/services/api-error.spec.ts
      - src/services/api-error.ts
      - src/services/generated
      - src/shared/validators/server-errors.spec.ts
      - src/shared/validators/server-errors.ts
      - src/store/loading.store.spec.ts
      - src/store/loading.store.ts
      - src/store/request-status.spec.ts
      - src/store/request-status.ts
      - src/testing/stub-api.spec.ts
      - src/testing/stub-api.ts
    dependencies:
      remove: ["@hey-api/openapi-ts"]
    scripts:
      remove: ["api:types"]
  server:auth:
    - src/app/auth-routes.spec.ts
    - src/layout/app-account-menu/app-account-menu.scss
    - src/layout/app-account-menu/app-account-menu.spec.ts
    - src/layout/app-account-menu/app-account-menu.vue
    - src/layout/app-auth-layout/app-auth-layout.scss
    - src/layout/app-auth-layout/app-auth-layout.spec.ts
    - src/layout/app-auth-layout/app-auth-layout.vue
    - src/core/guards/auth-guards.spec.ts
    - src/core/guards/auth.guard.ts
    - src/core/guards/guest.guard.ts
    - src/core/guards/role.guard.ts
    - src/core/initializers/session.initializer.spec.ts
    - src/core/initializers/session.initializer.ts
    - src/core/interceptors/auth.interceptor.spec.ts
    - src/core/interceptors/auth.interceptor.ts
    - src/core/providers/session.spec.ts
    - src/core/providers/session.ts
    - src/models/user
    - src/pages/auth
    - src/pages/forbidden
    - src/pages/user
    - src/services/auth.service.spec.ts
    - src/services/auth.service.ts
    - src/services/user.service.spec.ts
    - src/services/user.service.ts
    - src/shared/components/auth-card/auth-card.scss
    - src/shared/components/auth-card/auth-card.spec.ts
    - src/shared/components/auth-card/auth-card.vue
    - src/shared/directives/has-role.spec.ts
    - src/shared/directives/has-role.ts
    - src/shared/utils/next-path.spec.ts
    - src/shared/utils/next-path.ts
    - src/store/auth.store.spec.ts
    - src/store/auth.store.ts
    - src/store/user.store.spec.ts
    - src/store/user.store.ts
    - src/testing/auth-fixtures.ts
    - tests/e2e/auth-support.ts
    - tests/e2e/auth.spec.ts
    - tests/unit/user-constant.spec.ts
  server:database:
    - scripts/e2e-database-url.ts
    - tests/unit/e2e-database-url.spec.ts
postGenerate:
  - install
  - contract
  - format
