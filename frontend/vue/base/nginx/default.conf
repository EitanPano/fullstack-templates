# Rendered by the image's entrypoint (envsubst) to /etc/nginx/conf.d/default.conf. Only the
# @noserver-start
# PORT variable is ours; nginx's own variables are left alone. envsubst also
# rewrites a dollar-name inside a comment, so no dollar sign in comments.
# @noserver-end
# @server-start
# PORT and API_URL variables are ours; nginx's own variables are left alone. envsubst also
# rewrites a dollar-name inside a comment, so no dollar sign in comments.
# @server-end
#
# A location with an add_header of its own drops every add_header of the level above. So no
# @noserver-start
# add_header at server level: each static location includes the headers snippet itself.
# @noserver-end
# @server-start
# add_header at server level: each static location includes the headers snippet itself, and the
# proxied location has none, which leaves the server's own headers untouched.
# @server-end

resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off; # @server

# @noserver-start
# Only the path part is checked (a query may hold two dots).
# @noserver-end
# @server-start
# Only the path part is checked (a query may hold two dots), and /api/ requests are left to the
# server's own guards.
# @server-end
map $request_uri $refused_path {
  default 0;
  ~^/api/ 0; # @server
  ~*^[^?]*(\.\.|%2e%2e|%2e\.|\.%2e|%5c) 1;
}

server {
  listen ${PORT};
  server_name _;
  server_tokens off;
  root /usr/share/nginx/html;
  autoindex off;

  # Encoded or backslash traversal that nginx's parser lets through would be normalised into a
  # path that falls to the SPA fallback; refuse it. A raw path above the root gets nginx's 400.
  if ($refused_path) { return 404; }

  # Dotfiles anywhere.
  location ~ /\. { return 404; }

  # @server-start
  # Proxied API: ^~ beats the regex locations below. The variable defers DNS to request time, so
  # nginx starts while the server is down; with no URI part the request path passes unchanged.
  location ^~ /api/ {
    set $api_upstream ${API_URL};
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
  }
  # @server-end

  # Hashed build output: immutable. A missing file or a directory is a 404, never the SPA.
  location ~ ^/assets/.+[^/]$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }
  location ~ ^/assets/$ { return 404; }

  location = /index.html {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # The service worker, its Workbox runtime and the manifest must always be revalidated, or a
  # browser keeps an old worker. (The generic rule below says the same; this one names them.)
  # @pwa-start
  location ~ ^/(sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
  # @pwa-end

  # Any other path with an extension is a file or a 404 (a mistyped asset is not an HTML page).
  location ~ \.[^/]+$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  # Extension-less paths are client routes.
  location / {
    try_files /index.html =404;
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }
}
