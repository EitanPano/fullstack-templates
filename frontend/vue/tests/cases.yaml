schemaVersion: 1
cases:
  - name: default
    stack: vue-bun-express
    deploy: single
    withApp: true
  - name: split
    stack: vue-bun-express
    deploy: split
    withApp: true
  - name: python
    stack: vue-python-fastapi
    deploy: single
    withApp: true
  # The frontend generated by itself: no server, no generated client, no proxy. Its Playwright
  # config starts only the frontend, and its e2e runs.
  - name: alone
  # The smallest project the harness scaffolds: the frontend alone with both flags off.
  - name: alone-lean
    flags: { i18n: false, pwa: false }
  # The server without auth: no auth file, no @server:auth line and no withRefresh in the tree.
  - name: auth-off
    stack: vue-bun-express
    deploy: single
    server: { flags: { auth: false } }
  - name: postgres
    stack: vue-bun-express
    deploy: single
    server: { capabilities: { database: postgres } }
  # The flag at its non-default value: he.json, the language store and the toggle go; vue-i18n stays.
  - name: i18n-off
    stack: vue-bun-express
    deploy: single
    flags: { i18n: false }
  # The flag at its non-default value: the worker, the manifest and their dependencies go.
  - name: pwa-off
    stack: vue-bun-express
    deploy: single
    flags: { pwa: false }
  # Both frontend flags at their non-default value, auth on: the shared files must hold alone.
  - name: flags-off
    stack: vue-bun-express
    deploy: single
    flags: { i18n: false, pwa: false }
  # Non-default brand values through every gate: the cases above all generate the default brand.
  - name: brand
    stack: vue-bun-express
    deploy: single
    brand:
      primary: "#ea580c"
      neutral: "#64748b"
      radius: sm
      font: inter
      theme: light
      density: compact
