schemaVersion: 1
cases:
  - name: default
    stack: react-python-fastapi
    deploy: single
    withApp: true
  - name: split
    stack: react-python-fastapi
    deploy: split
    withApp: true
  - name: bun
    stack: react-bun-express
    deploy: single
    withApp: true
  - name: alone
  - name: auth-off
    stack: react-bun-express
    deploy: single
    server: { flags: { auth: false } }
  - name: auth-off-postgres
    stack: react-bun-express
    deploy: single
    server: { flags: { auth: false }, capabilities: { database: postgres } }
  # Non-default brand values through every gate: the cases above all generate the default brand.
  - name: brand
    stack: react-bun-express
    deploy: single
    brand:
      primary: '#ea580c'
      neutral: '#64748b'
      radius: sm
      font: inter
      theme: light
      density: compact
