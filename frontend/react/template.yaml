schemaVersion: 1
id: react
kind: frontend
name: React 19 SPA (Vite)
version: 6.0.0
summary: "Vite and React 19 single-page app: React Router data mode, Redux Toolkit with RTK Query over a client generated from the server's contract, Radix primitives styled by co-located SCSS on a global token tree"
runtime: { language: typescript, platform: node, minVersion: "24" }
tools:
  - { name: bun, min: "1.4" }
  - { name: node, min: "24" }
placeholders: [PROJECT_NAME]
dependencies: { manifest: package.json, adapter: npm }
commands:
  install: bun install
  dev: bun run dev
  check: bun run check
  typecheck: bun run typecheck
  lint: bun run lint
  format: bun run format
  test: bun run test
  testE2e: bun run test:e2e
  contract: bun run api:types
contract: { consumes: "<server>/openapi.json" }
http: { port: 5173, health: / }
static: { out: dist }
gitignore: [node]
agents: AGENTS.md
defaultStack: react-python-fastapi
# Everything that reaches the server exists only while the plan has one (ADR 0011): the generated
# client, the data layer's base, the error envelope and the files that import them. Lines inside
# shared files carry // @server markers. Generated alone, the package has no API surface.
# The auth glue exists only while the stack's server has its auth flag on (the contract then has
# /api/auth and /api/user). Lines inside shared files carry // @server:auth markers.
onlyWhen:
  server:
    onlyPaths:
      - openapi-ts.config.ts
      - src/core/config/api-client.test.ts
      - src/core/config/api-client.ts
      - src/models/api-error
      - src/services/api.test.ts
      - src/services/api.ts
      - src/services/call.test.ts
      - src/services/call.ts
      - src/services/generated
      - src/services/with-copy.test.ts
      - src/services/with-copy.ts
      - src/shared/components/form/report-failure
      - src/shared/utils/is-api-error.test.ts
      - src/shared/utils/is-api-error.ts
    dependencies:
      remove: ['@hey-api/openapi-ts']
    scripts:
      remove: ['api:types']
  server:auth:
    - src/core/auth
    - src/core/config/api-client-refresh.test.ts
    - src/layout/app-account-menu
    - src/layout/app-auth-error.tsx
    - src/layout/app-auth-layout
    - src/layout/app-auth-loading.tsx
    - src/models/user
    - src/pages/auth
    - src/pages/forbidden
    - src/pages/user
    - src/services/auth.api.test.ts
    - src/services/auth.api.ts
    - src/services/user.api.test.ts
    - src/services/user.api.ts
    - src/shared/components/auth-card
    - src/shared/utils/initials.test.ts
    - src/shared/utils/initials.ts
    - src/shared/utils/is-user.test.ts
    - src/shared/utils/is-user.ts
    - src/shared/utils/next-path.test.ts
    - src/shared/utils/next-path.ts
    - src/store/use-sign-out.ts
    - src/testing/auth-fixtures.ts
    - src/testing/render-in-router.tsx
    - tests/e2e/auth-support.ts
    - tests/e2e/auth.spec.ts
  server:database:
    - scripts/e2e-database-url.ts
    - tests/unit/e2e-database-url.test.ts
postGenerate:
  - install
  - contract
  - format
