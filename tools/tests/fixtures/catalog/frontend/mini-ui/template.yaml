schemaVersion: 1
id: mini-ui
kind: frontend
name: Mini UI
version: 1.0.0
summary: A minimal frontend fixture
runtime:
  language: typescript
  platform: bun
tools:
  - name: bun
    min: '1.4'
placeholders:
  - PROJECT_NAME
  - PROJECT_DISPLAY_NAME
  - THEME_LIGHT
  - THEME_DARK
  - THEME_RADIUS
  - THEME_DEFAULT
  - THEME_DENSITY
  - THEME_FONT
  - THEME_FONT_STACK
dependencies:
  manifest: package.json
  adapter: npm
commands:
  install: bun ./ok.ts
  check: bun ./ok.ts
  contract: bun ./ok.ts
contract:
  consumes: '<server>/openapi.json'
http:
  port: 3000
  health: /
onlyWhen:
  server:auth: [src/session.ts]
gitignore: [node]
agents: AGENTS.md
defaultStack: mini
postGenerate: [install, contract]
