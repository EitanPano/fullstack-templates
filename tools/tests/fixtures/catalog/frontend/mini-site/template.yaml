schemaVersion: 1
id: mini-site
kind: frontend
name: Mini site
version: 1.0.0
summary: A minimal frontend fixture that ships no image
docker: false
runtime:
  language: typescript
  platform: bun
tools:
  - name: bun
    min: '1.4'
placeholders:
  - PROJECT_NAME
  - PROJECT_DISPLAY_NAME
  - THEME_LIGHT
  - THEME_DARK
  - THEME_RADIUS
  - THEME_DEFAULT
  - THEME_DENSITY
  - THEME_FONT
  - THEME_FONT_STACK
dependencies:
  manifest: package.json
  adapter: npm
commands:
  install: bun ./ok.ts
  check: bun ./ok.ts
  contract: bun ./ok.ts contract
  testE2e: bun ./ok.ts testE2e
contract:
  consumes: '<server>/openapi.json'
http:
  port: 4321
  health: /
static:
  out: dist
flags:
  islands:
    summary: Interactive islands
    default: false
    onlyPaths: [src/islands, src/both.ts]
  auth:
    summary: Accounts
    default: true
    onlyPaths: [src/auth.ts, src/islands/login-form.ts, src/both.ts]
onlyWhen:
  server: [src/client.ts]
  server:auth: [src/session.ts]
gitignore: [node]
agents: AGENTS.md
defaultStack: mini-site-fn
postGenerate: [install, contract]
