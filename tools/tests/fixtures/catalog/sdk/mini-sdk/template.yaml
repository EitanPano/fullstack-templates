schemaVersion: 1
id: mini-sdk
kind: sdk
name: Mini SDK
version: 1.0.0
summary: A minimal sdk fixture
runtime:
  language: typescript
  platform: bun
tools:
  - name: bun
    min: '1.4'
placeholders: [PROJECT_NAME]
commands:
  install: bun ./ok.ts
  check: bun ./ok.ts
  testE2e: bun ./ok.ts e2e
  contract: bun ./ok.ts
contract:
  consumes: '<server>/openapi.json'
http:
  port: 5180
  health: /
cdn:
  out: dist/cdn
gitignore: [node]
agents: AGENTS.md
defaultStack: mini
postGenerate: [install, contract]
