schemaVersion: 1
kind: database
id: fake
name: Fake database
service: database
compose: compose.yaml
env:
  - name: DATABASE_URL
    summary: Connection string of the fake database
    local: fake://localhost:5432/app
    compose: fake://database:5432/app
    test: fake://localhost:5432/app_test
    testOverride: TEST_DATABASE_URL
    e2e: fake://localhost:5432/app_e2e
    e2eOverride: E2E_DATABASE_URL
    secret: true
  - name: FAKE_POOL_SIZE
    summary: Connections the fake database keeps open
    local: '5'
    compose: '5'
    test: '2'
files:
  - db/init.sql
